[project]
name = "csfrbench"
version = "1.1.0"
description = "CSFRBench and Learned Wiring (LeWi): the research code of the paper as run"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "hydra-core>=1.3.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "omegaconf>=2.3.1",
    "pandas>=2.0",
    "pyarrow>=14",
    "pypdf>=4",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "torch>=2.2,<3.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
